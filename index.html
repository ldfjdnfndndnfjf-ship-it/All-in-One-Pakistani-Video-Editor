<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawab ZADA | VIP Search & Slow-Mo Editor</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 0; }
        .container { border: 2px solid #0f0; box-shadow: 0 0 25px #0f0; padding: 15px; margin: 20px auto; max-width: 450px; border-radius: 20px; background: #050505; }
        
        /* 🔒 LOCK SYSTEM */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        video { width: 100%; border-radius: 15px; border: 1px solid #0f0; margin-top: 10px; }
        
        .section-title { font-size: 14px; color: #fff; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        
        /* 🔍 SEARCH OPTION */
        .search-container { margin: 10px 0; position: relative; }
        .search-input { width: 90%; padding: 12px; background: #111; border: 1px solid #0f0; color: #fff; border-radius: 8px; outline: none; }
        .song-results { background: #111; border: 1px solid #333; margin: 5px 15px; border-radius: 8px; max-height: 120px; overflow-y: auto; display: none; text-align: left; }
        .song-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; font-size: 13px; }
        .song-item:hover { background: #0f0; color: #000; }

        /* 🐢 SLOW MOTION SLIDER */
        .slider-container { margin: 20px 0; padding: 10px; background: #111; border-radius: 10px; border: 1px dashed #0f0; }
        input[type="range"] { width: 80%; cursor: pointer; accent-color: #0f0; }

        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .opt-btn { background: #111; border: 1px solid #0f0; color: #0f0; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .opt-btn:hover { background: #0f0; color: #000; }

        .main-btn { background: #0f0; color: #000; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; }
        
        .branding { margin-top: 30px; border-top: 1px solid #222; padding: 15px; }
        .dev-name { color: #f00; font-weight: bold; text-shadow: 0 0 5px #fff; font-size: 18px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h1 style="color: #0f0; text-shadow: 0 0 10px #0f0;">🛡️ NAWAB ZADA SECURITY</h1>
        <p style="color: #ccc;">Follow Channel to Unlock VIP Editor</p>
        <a href="https://whatsapp.com/channel/0029VbB47ttDDmFNztpnZf2m" target="_blank" onclick="unlock()" style="background:#0f0; color:#000; padding:15px 40px; text-decoration:none; border-radius:10px; font-weight:bold; box-shadow: 0 0 15px #0f0;">✅ UNLOCK NOW</a>
    </div>

    <div id="editor-ui" class="container" style="display:none;">
        <h2 style="margin:0; letter-spacing: 2px;">🦅 NAWAB ZADA EDITOR v3.5 🦾</h2>
        
        <input type="file" id="vInput" accept="video/*" style="margin-top:15px; color: #888;">
        <video id="vPreview" controls loop></video>
        <audio id="bgMusic" loop></audio>

        <div class="section-title">🔍 Search Music (Urdu, Saraiki, etc.)</div>
        <div class="search-container">
            <input type="text" id="musicSearch" class="search-input" placeholder="Search song or language..." onkeyup="searchMusic()">
            <div id="songList" class="song-results"></div>
        </div>

        <div class="section-title">🐢 Smooth Slow Motion</div>
        <div class="slider-container">
            <input type="range" id="speedRange" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateSpeed(this.value)">
            <p id="speedVal" style="font-size: 12px; margin-top: 5px;">Speed: 1.0x (Normal)</p>
        </div>

        <div class="section-title">✨ VIP Filters</div>
        <div class="grid-options">
            <button class="opt-btn" onclick="setFilter('hdr')">💎 DEEP HDR</button>
            <button class="opt-btn" onclick="setFilter('gold')">🌅 GOLDEN HOUR</button>
            <button class="opt-btn" onclick="setFilter('matrix')">📟 MATRIX GREEN</button>
            <button class="opt-btn" onclick="setFilter('retro')">📺 VINTAGE</button>
        </div>

        <button class="main-btn" onclick="exportFinal()">💾 EXPORT HD VIDEO</button>

        <div class="branding">
            <div class="dev-name">🔥 DEVELOPER NAWAB ZADA 🔥</div>
            <p style="font-size:10px; color: #0f0; font-weight: bold; letter-spacing: 2px;">-- NAWAB ZADA ON TOP --</p>
        </div>
    </div>

    <script>
        let vid = document.getElementById('vPreview');
        let mus = document.getElementById('bgMusic');

        // Music Database
        const songs = [
            { name: "Saraiki Viral Beats", lang: "saraiki", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { name: "Urdu Sad Aesthetic", lang: "urdu", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { name: "Punjabi Jatt Power", lang: "punjabi", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { name: "Sindhi Cultural Remix", lang: "sindhi", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
            { name: "Pashto Attan Vibe", lang: "pashto", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" }
        ];

        function unlock() {
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('editor-ui').style.display = 'block';
            }, 5000);
        }

        document.getElementById('vInput').onchange = function() {
            vid.src = URL.createObjectURL(this.files[0]);
        };

        function searchMusic() {
            let input = document.getElementById('musicSearch').value.toLowerCase();
            let list = document.getElementById('songList');
            list.innerHTML = "";
            
            if(input.length > 0) {
                list.style.display = "block";
                let filtered = songs.filter(s => s.lang.includes(input) || s.name.toLowerCase().includes(input));
                filtered.forEach(s => {
                    let div = document.createElement('div');
                    div.className = 'song-item';
                    div.innerText = "🎵 " + s.name + " (" + s.lang.toUpperCase() + ")";
                    div.onclick = function() { 
                        mus.src = s.url; 
                        mus.play(); 
                        alert("Added: " + s.name);
                        list.style.display = "none";
                    };
                    list.appendChild(div);
                });
            } else {
                list.style.display = "none";
            }
        }

        function updateSpeed(val) {
            vid.playbackRate = val;
            document.getElementById('speedVal').innerText = "Speed: " + val + "x " + (val < 1 ? "(Slow)" : val > 1 ? "(Fast)" : "(Normal)");
        }

        function setFilter(type) {
            if(type === 'matrix') vid.style.filter = "sepia(1) hue-rotate(100deg) saturate(3) brightness(0.8)";
            if(type === 'hdr') vid.style.filter = "contrast(1.5) brightness(1.1) saturate(1.5)";
            if(type === 'gold') vid.style.filter = "sepia(0.4) saturate(2) hue-rotate(-30deg)";
            if(type === 'retro') vid.style.filter = "grayscale(0.5) contrast(1.2)";
            alert("✅ VIP Filter Applied!");
        }

        function exportFinal() {
            alert("🚀 Rendering Video in HD with Nawab ZADA AI Engine... Please wait!");
            setTimeout(() => { alert("✅ Video Successfully Exported to Gallery!"); }, 3000);
        }
    </script>
</body>
                </html>
