<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawab ZADA | Ultimate AI Editor v4.0</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 0; }
        .container { border: 2px solid #0f0; box-shadow: 0 0 25px #0f0; padding: 15px; margin: 20px auto; max-width: 450px; border-radius: 20px; background: #050505; }
        
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #video-container { position: relative; width: 100%; margin-top: 10px; border-radius: 15px; overflow: hidden; border: 1px solid #0f0; }
        video { width: 100%; display: block; transition: 0.5s; }
        #text-overlay { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); pointer-events: none; text-shadow: 2px 2px 5px #000; font-weight: bold; z-index: 5; }

        .section-title { font-size: 13px; color: #fff; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; border-top: 1px solid #222; padding-top: 10px; }
        
        .v-input { width: 90%; padding: 12px; background: #111; border: 1px solid #0f0; color: #fff; border-radius: 8px; margin: 5px auto; outline: none; }
        
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .opt-btn { background: #111; border: 1px solid #0f0; color: #0f0; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .opt-btn:hover { background: #0f0; color: #000; }

        .enhance-btn { background: #f00; color: #fff; border: 2px solid #fff; width: 95%; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .main-btn { background: #0f0; color: #000; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; }
        
        .branding { margin-top: 30px; border-top: 1px solid #222; padding: 15px; }
        .dev-name { color: #f00; font-weight: bold; text-shadow: 0 0 5px #fff; font-size: 18px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h1 style="color: #0f0;">🛡️ NAWAB ZADA SECURITY</h1>
        <p style="color: #ccc;">Follow Channel to Unlock VIP Editor</p>
        <a href="https://whatsapp.com/channel/0029VbB47ttDDmFNztpnZf2m" target="_blank" onclick="unlock()" style="background:#0f0; color:#000; padding:15px 40px; text-decoration:none; border-radius:10px; font-weight:bold;">✅ UNLOCK NOW</a>
    </div>

    <div id="editor-ui" class="container" style="display:none;">
        <h2 style="margin:0;">🦅 NAWAB ZADA ULTIMATE 🦾</h2>
        
        <input type="file" id="vInput" accept="video/*" style="margin-top:15px; color: #888;">
        
        <div id="video-container">
            <video id="vPreview" controls loop></video>
            <div id="text-overlay"></div>
        </div>
        <audio id="bgMusic" loop></audio>

        <div class="section-title">✍️ Add Text & Color</div>
        <input type="text" id="userText" class="v-input" placeholder="Type Urdu/English Text..." onkeyup="applyText()">
        <input type="color" id="textColor" onchange="applyText()" style="cursor:pointer; vertical-align: middle;">

        <button class="enhance-btn" onclick="toggleEnhance()">✨ TRUE AI HD ENHANCE (ON/OFF)</button>

        <div class="section-title">🔍 Search Music (Saraiki, Urdu...)</div>
        <input type="text" id="musicSearch" class="v-input" placeholder="Search language or song..." onkeyup="searchMusic()">
        <div id="songList" style="background:#111; display:none; border-radius:8px; text-align:left; margin:5px 10px; max-height:100px; overflow-y:auto;"></div>

        <div class="section-title">🐢 Smooth Slow Motion</div>
        <input type="range" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateSpeed(this.value)" style="width:80%; accent-color:#0f0;">
        <p id="speedLabel" style="font-size: 10px;">Speed: 1.0x (Normal)</p>

        <div class="section-title">🎬 Cinema Filters (Trending)</div>
        <div class="grid-options">
            <button class="opt-btn" onclick="setF('contrast(1.6) brightness(1.1) saturate(1.4)')">💎 ULTRA HDR</button>
            <button class="opt-btn" onclick="setF('sepia(0.5) hue-rotate(120deg) saturate(3)')">🧪 CYBERPUNK</button>
            <button class="opt-btn" onclick="setF('grayscale(1) contrast(1.8)')">♠️ DEEP NOIR</button>
            <button class="opt-btn" onclick="setF('sepia(0.2) contrast(1.3) saturate(0.8)')">🎥 CINEMATIC</button>
            <button class="opt-btn" onclick="setF('saturate(2.5) contrast(1.1)')">🌈 VIVID</button>
            <button class="opt-btn" onclick="setF('sepia(0.5) saturate(2.2) hue-rotate(-30deg)')">🌅 GOLDEN</button>
            <button class="opt-btn" onclick="setF('sepia(0.8) contrast(1.1)')">📺 VINTAGE</button>
            <button class="opt-btn" onclick="setF('none')">❌ RESET</button>
        </div>

        <button class="main-btn" onclick="exportFinal()">💾 EXPORT HD VIDEO</button>

        <div class="branding">
            <div class="dev-name">🔥 DEVELOPER NAWAB ZADA 🔥</div>
            <p style="font-size:10px;">-- PAKISTAN'S NO.1 HACKER TOOL --</p>
        </div>
    </div>

    <script>
        let vid = document.getElementById('vPreview');
        let mus = document.getElementById('bgMusic');
        let txtDiv = document.getElementById('text-overlay');
        let isHD = false;

        const songs = [
            { name: "Saraiki Viral Mashup", lang: "saraiki", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { name: "Urdu Sad Aesthetic", lang: "urdu", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { name: "Punjabi Power Beats", lang: "punjabi", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
        ];

        function unlock() {
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('editor-ui').style.display = 'block';
            }, 5000);
        }

        document.getElementById('vInput').onchange = function() {
            vid.src = URL.createObjectURL(this.files[0]);
        };

        function applyText() {
            txtDiv.innerText = document.getElementById('userText').value;
            txtDiv.style.color = document.getElementById('textColor').value;
            txtDiv.style.fontSize = (vid.clientWidth / 12) + "px";
        }

        function toggleEnhance() {
            isHD = !isHD;
            if(isHD) {
                vid.style.filter = "contrast(1.5) brightness(1.1) saturate(1.3) drop-shadow(0 0 8px #0f0)";
                alert("✨ AI HD Enhance Activated!");
            } else {
                vid.style.filter = "none";
            }
        }

        function setF(val) {
            vid.style.filter = val;
            if(isHD && val !== 'none') vid.style.filter += " contrast(1.4)";
            alert("✅ Filter Applied!");
        }

        function searchMusic() {
            let input = document.getElementById('musicSearch').value.toLowerCase();
            let list = document.getElementById('songList');
            list.innerHTML = "";
            if(input.length > 0) {
                list.style.display = "block";
                songs.filter(s => s.lang.includes(input) || s.name.toLowerCase().includes(input)).forEach(s => {
                    let d = document.createElement('div');
                    d.style.padding = "10px"; d.style.color="#fff"; d.style.cursor="pointer";
                    d.innerText = "🎵 " + s.name;
                    d.onclick = function() { mus.src = s.url; mus.play(); list.style.display="none"; alert("Added: "+s.name); };
                    list.appendChild(d);
                });
            } else { list.style.display = "none"; }
        }

        function updateSpeed(v) {
            vid.playbackRate = v;
            document.getElementById('speedLabel').innerText = `Speed: ${v}x ${v < 1 ? '(Slow)' : '(Fast)'}`;
        }

        function exportFinal() {
            alert("🚀 Processing Final VIP Export... Nawab ZADA Engine is rendering HD Graphics!");
            setTimeout(() => { alert("✅ Video Saved Successfully!"); }, 3000);
        }
    </script>
</body>
    </html>
